# Intégration continue (sprint 2, étape 4 ; V-03).
# Sur chaque PR vers main et sur main : lint, puis tests, puis build de l'image ; recherche de
# secrets en parallèle ; sur une PR, révision de test dans Azure (C19). Le job « verdict » résume
# le tout : c'est le seul contrôle requis par la protection de main.
# Actions épinglées par SHA ; aucune version publiée depuis moins de deux semaines.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.5"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  CONTAINERAPP_VERSION: "1.3.0b5"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # Mêmes cibles que sur le poste (Makefile) : la CI garantit qu'elles restent justes.
      - run: make lint types

  tests:
    needs: lint
    runs-on: ubuntu-24.04
    # 2 à 3 minutes d'ordinaire ; l'installation des dépendances du navigateur par le miroir Ubuntu
    # d'Azure a pris jusqu'à 13 minutes le 26 octobre 2026 (INC-10).
    timeout-minutes: 30
    # PostgreSQL de test (sprint 3) : les tests de base y créent une base neuve, puis la suppriment.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muninn
          POSTGRES_PASSWORD: ci-seulement
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muninn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://muninn:ci-seulement@localhost:5432/postgres
      MUNINN_TESTS_BASE: obligatoire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Navigateur du contrôle d'accessibilité
        run: uv run playwright install --with-deps chromium
      # TEST_DATABASE_URL et MUNINN_TESTS_BASE viennent du job : aucun test de base n'est ignoré.
      - run: make tests

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construction de l'image
        run: >
          docker build -f docker/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
          -t muninn:ci .
      - name: Test de fumée de l'image
        run: |
          docker run -d --name api -p 8000:8000 muninn:ci
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/version | tee version.json
          grep -q '"git_sha":"${{ github.sha }}"' version.json
          test "$(docker exec api whoami)" = "muninn"
          # Migrations embarquées dans l'image : la commande et les fichiers sont présents.
          docker run --rm muninn:ci muninn-db --help > /dev/null
          # Tâche des données et jeu de questions de démonstration (sprint 3, étape 10).
          docker run --rm muninn:ci sh -c 'command -v muninn-donnees && command -v muninn-questions' > /dev/null
          docker run --rm muninn:ci python -c "from muninn.referentiels import demonstration; assert len(demonstration.questions()) == 10"
          # Données de l'ingestion embarquées : requête SPARQL et instantané de secours du lexique.
          docker run --rm muninn:ci python -c "from muninn.ingestion import lexique, sirene; assert lexique.REQUETE_WIKIDATA and lexique.FICHIER_SECOURS.is_file() and sirene.FICHIER_REQUETE.is_file() and lexique.FICHIER_EVALUATIONS.is_file()"
          docker run --rm muninn:ci python -c "from muninn.db.migrer import DOSSIER_MIGRATIONS as d; assert (d / 'env.py').is_file() and (d / 'script.py.mako').is_file() and any((d / 'versions').glob('0001_*.py'))"
      - name: Journaux du conteneur
        if: always()
        run: docker logs api || true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installation de gitleaks (empreinte vérifiée)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Recherche de secrets dans tout l'historique
        run: ./gitleaks git . --no-banner --redact --exit-code 1

  # Évaluation de l'agent (V-08, sprint 4, étape 9 ; D-64) : seulement si l'empreinte du paquet
  # d'extraction diffère de celle de main, ou à la demande. Identité Azure dédiée, qui ne peut
  # qu'appeler le modèle (infra/azure/06-evaluation.sh) : le code d'une PR n'a aucun autre droit.
  # Sans accès au modèle, ou au-delà du plafond de 1 € : « non mesuré », bloquant.
  evaluation:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: evaluation
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - id: empreinte
        name: Empreinte du paquet, ici et sur main
        run: |
          git worktree add --detach ../base origin/main
          calcul='from pathlib import Path; import sys; from muninn.extraction.paquet import calculer_empreinte; print(calculer_empreinte(Path(sys.argv[1])))'
          ici=$(uv run python -c "$calcul" .)
          base=$(uv run python -c "$calcul" ../base 2>/dev/null || echo absente)
          echo "empreinte ici=$ici main=$base"
          if [ "$ici" != "$base" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "requise=oui" >> "$GITHUB_OUTPUT"
          else
            echo "requise=non" >> "$GITHUB_OUTPUT"
            echo "Empreinte inchangée : évaluation non requise." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.empreinte.outputs.requise == 'oui'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.empreinte.outputs.requise == 'oui'
        name: Campagne d'évaluation (plafond 1 €, D-64)
        env:
          LLM_FOURNISSEUR: azure
          AZURE_AI_ENDPOINT: https://adialloext-muninn1-resource.services.ai.azure.com
          # Langfuse (V-13) : dataset et expérience ; sans ces secrets, le harnais tourne sans.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: https://cloud.langfuse.com
        run: |
          set -o pipefail
          uv run python -m muninn.evaluation.harnais --sortie rapports-evaluation | tee resume.txt
      - if: always() && steps.empreinte.outputs.requise == 'oui'
        name: Rapport dans le résumé du job
        run: |
          { echo '```'; cat resume.txt 2>/dev/null || echo "aucun résumé"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat rapports-evaluation/*.json 2>/dev/null || true

  # Révision de test par PR (C19) : l'image de la PR tourne dans Azure, sur une application à part
  # (ca-muninn-api-test), sans base ni secret, et y est contrôlée. Identité id-muninn-test
  # (infra/azure/15-test.sh) : pousser dans le registre de test crmuninntest (et en effacer les
  # anciennes images), mettre à jour cette application, sans pouvoir la supprimer ; la
  # préproduction et la production lui sont fermées.
  # Sur main, la livraison en préproduction tient ce rôle ; partout ailleurs (PR, lancement manuel
  # sur une branche), le job tourne et le verdict l'exige.
  # Barrière de qualité, pas de sécurité : sur une PR, c'est le ci.yml de la PR qui s'exécute ; seule
  # la relecture avant fusion arrête un code malveillant. Les droits d'id-muninn-test en bornent
  # l'effet à l'application et au registre de test.
  test:
    if: github.ref != 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Une seule PR à la fois sur l'application de test ; les suivantes attendent leur tour.
    concurrency:
      group: test-azure
      queue: max
    environment:
      name: test
      url: ${{ steps.test.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - name: Contrôle des options az des scripts
        run: python3 infra/azure/verifier-options.py infra/azure/*.sh
      - name: Image de la PR, poussée dans le registre de test
        run: |
          image="crmuninntest.azurecr.io/muninn:${GITHUB_SHA}"
          az acr login --name crmuninntest
          docker build -f docker/Dockerfile --build-arg GIT_SHA="${GITHUB_SHA}" -t "$image" .
          docker push "$image"
      - id: test
        name: Révision de test, contrôlée
        run: bash infra/azure/tester-pr.sh "${GITHUB_SHA}"

  verdict:
    if: always()
    needs: [lint, tests, build, secrets, evaluation, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tous les contrôles doivent réussir
        run: |
          echo "lint=${{ needs.lint.result }} tests=${{ needs.tests.result }}"
          echo "build=${{ needs.build.result }} secrets=${{ needs.secrets.result }}"
          echo "evaluation=${{ needs.evaluation.result }} test=${{ needs.test.result }}"
          # Révision de test (C19) : requise hors de main (PR ou lancement manuel sur une branche :
          # sinon un lancement manuel rendrait un verdict vert sans elle) ; sur main, ignorée.
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            test "${{ needs.test.result }}" = "success"
          else
            test "${{ needs.test.result }}" = "skipped"
          fi
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.evaluation.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"

  # Livraison continue (sprint 2, étape 6) : uniquement sur main, après un verdict vert.
  # Identité Azure sans secret (OIDC, identité managée id-muninn-deploiement, D-47).
  # Conditions explicites sur le résultat du job précédent : sur main, le job « test » est ignoré,
  # et GitHub ignore alors tous les jobs en aval, même après un verdict vert, si leur condition ne
  # porte pas sur ce résultat (fusion de C19 non livrée le 2 novembre 2026).
  preproduction:
    if: >-
      ${{ !cancelled() && needs.verdict.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Même verrou que le retour arrière du même environnement.
    concurrency:
      group: livraison-preproduction
      cancel-in-progress: false
    environment:
      name: preproduction
      url: ${{ steps.livraison.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - name: Contrôle des options az des scripts
        run: python3 infra/azure/verifier-options.py infra/azure/*.sh
      - name: Image étiquetée par le SHA, poussée dans le registre
        run: |
          image="crmuninn.azurecr.io/muninn:${GITHUB_SHA}"
          az acr login --name crmuninn
          docker build -f docker/Dockerfile --build-arg GIT_SHA="${GITHUB_SHA}" -t "$image" .
          docker push "$image"
      - id: livraison
        name: Livraison en préproduction
        run: bash infra/azure/deployer.sh preproduction "${GITHUB_SHA}"

  production:
    if: ${{ !cancelled() && needs.preproduction.result == 'success' }}
    needs: preproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Même verrou que le retour arrière du même environnement.
    concurrency:
      group: livraison-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.livraison.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - id: livraison
        name: Livraison en production (même image, déjà contrôlée en préproduction)
        run: bash infra/azure/deployer.sh production "${GITHUB_SHA}"
