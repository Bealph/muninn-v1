# Intégration continue (sprint 2, étape 4 ; V-03).
# Sur chaque PR vers main et sur main : lint, puis tests, puis build de l'image ; recherche de
# secrets en parallèle. Le job « verdict » résume le tout : c'est le seul contrôle requis par la
# protection de main.
# Actions épinglées par SHA ; aucune version publiée depuis moins de deux semaines.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.5"
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
  CONTAINERAPP_VERSION: "1.3.0b5"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # PostgreSQL de test (sprint 3) : les tests de base y créent une base neuve, puis la suppriment.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: muninn
          POSTGRES_PASSWORD: ci-seulement
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muninn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://muninn:ci-seulement@localhost:5432/postgres
      MUNINN_TESTS_BASE: obligatoire
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Navigateur du contrôle d'accessibilité
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -ra

  build:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construction de l'image
        run: >
          docker build -f docker/Dockerfile
          --build-arg GIT_SHA=${{ github.sha }}
          -t muninn:ci .
      - name: Test de fumée de l'image
        run: |
          docker run -d --name api -p 8000:8000 muninn:ci
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          curl -fsS http://localhost:8000/version | tee version.json
          grep -q '"git_sha":"${{ github.sha }}"' version.json
          test "$(docker exec api whoami)" = "muninn"
          # Migrations embarquées dans l'image : la commande et les fichiers sont présents.
          docker run --rm muninn:ci muninn-db --help > /dev/null
          # Données de l'ingestion embarquées : requête SPARQL et instantané de secours du lexique.
          docker run --rm muninn:ci python -c "from muninn.ingestion import lexique; assert lexique.REQUETE_WIKIDATA and lexique.FICHIER_SECOURS.is_file()"
          docker run --rm muninn:ci python -c "from muninn.db.migrer import DOSSIER_MIGRATIONS as d; assert (d / 'env.py').is_file() and (d / 'script.py.mako').is_file() and any((d / 'versions').glob('0001_*.py'))"
      - name: Journaux du conteneur
        if: always()
        run: docker logs api || true

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Installation de gitleaks (empreinte vérifiée)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Recherche de secrets dans tout l'historique
        run: ./gitleaks git . --no-banner --redact --exit-code 1

  verdict:
    if: always()
    needs: [lint, tests, build, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tous les contrôles doivent réussir
        run: |
          echo "lint=${{ needs.lint.result }} tests=${{ needs.tests.result }}"
          echo "build=${{ needs.build.result }} secrets=${{ needs.secrets.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.tests.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.secrets.result }}" = "success"

  # Livraison continue (sprint 2, étape 6) : uniquement sur main, après un verdict vert.
  # Identité Azure sans secret (OIDC, identité managée id-muninn-deploiement, D-47).
  preproduction:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verdict
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Même verrou que le retour arrière du même environnement.
    concurrency:
      group: livraison-preproduction
      cancel-in-progress: false
    environment:
      name: preproduction
      url: ${{ steps.livraison.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - name: Contrôle des options az des scripts
        run: python3 infra/azure/verifier-options.py infra/azure/*.sh
      - name: Image étiquetée par le SHA, poussée dans le registre
        run: |
          image="crmuninn.azurecr.io/muninn:${GITHUB_SHA}"
          az acr login --name crmuninn
          docker build -f docker/Dockerfile --build-arg GIT_SHA="${GITHUB_SHA}" -t "$image" .
          docker push "$image"
      - id: livraison
        name: Livraison en préproduction
        run: bash infra/azure/deployer.sh preproduction "${GITHUB_SHA}"

  production:
    needs: preproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Même verrou que le retour arrière du même environnement.
    concurrency:
      group: livraison-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.livraison.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - id: livraison
        name: Livraison en production (même image, déjà contrôlée en préproduction)
        run: bash infra/azure/deployer.sh production "${GITHUB_SHA}"
