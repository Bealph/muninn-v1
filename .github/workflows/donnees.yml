# Chargement des données d'un environnement en une opération (sprint 3, étape 10 ; D-58).
# Lancement manuel : onglet Actions, « donnees », « Run workflow » ; ou
#   gh workflow run donnees -f environnement=production
# La tâche Container Apps fait migrations, rôles et ingestion ; le jeu de questions de
# démonstration est ensuite rejoué contre l'API publique. Une source inchangée ne crée aucune
# version : le rejeu est sans doublon.

name: donnees

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement"
        type: choice
        options: [production, preproduction]
        required: true

permissions:
  contents: read

env:
  CONTAINERAPP_VERSION: "1.3.0b5"
  UV_VERSION: "0.12.5"

jobs:
  donnees:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environnement }}
    # Même verrou que la livraison et le retour arrière : jamais en même temps qu'eux.
    concurrency:
      group: livraison-${{ inputs.environnement }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - name: Tâche des données, puis jeu de questions
        env:
          ENVIRONNEMENT: ${{ inputs.environnement }}
        run: bash infra/azure/donnees.sh "$ENVIRONNEMENT"
