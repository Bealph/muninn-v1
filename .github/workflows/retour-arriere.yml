# Retour arrière en une opération (sprint 2, étape 8 ; critère P4).
# Lancement manuel : onglet Actions, « retour-arriere », « Run workflow » ; ou
#   gh workflow run retour-arriere -f environnement=production
# Sans SHA : révision créée juste avant celle qui reçoit le trafic. Avec SHA : ce commit-là.
# Seul le trafic bascule : aucune image n'est reconstruite, aucune révision n'est créée.

name: retour-arriere

on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement"
        type: choice
        options: [production, preproduction]
        required: true
      sha:
        description: "SHA du commit à servir (vide : version précédente)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CONTAINERAPP_VERSION: "1.3.0b5"

jobs:
  retour-arriere:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environnement }}
    # Même verrou que la livraison du même environnement : jamais les deux en même temps.
    concurrency:
      group: livraison-${{ inputs.environnement }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Extension containerapp (version épinglée)
        run: az extension add --name containerapp --version "$CONTAINERAPP_VERSION" --allow-preview true --yes
      - name: Retour arrière
        env:
          ENVIRONNEMENT: ${{ inputs.environnement }}
          SHA_VISE: ${{ inputs.sha }}
        run: bash infra/azure/retour-arriere.sh "$ENVIRONNEMENT" "$SHA_VISE"
