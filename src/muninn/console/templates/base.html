<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Muninn, console de démonstration{% endblock %}</title>
  <style>
    /* Polices de Muninn (D-92) : Nunito pour le texte, IBM Plex Mono pour le code. */
    @font-face { font-family: "Nunito"; font-weight: 400; font-style: normal; font-display: swap;
                 src: url("/static/polices/Nunito-Regular.woff2") format("woff2"); }
    @font-face { font-family: "Nunito"; font-weight: 700; font-style: normal; font-display: swap;
                 src: url("/static/polices/Nunito-Bold.woff2") format("woff2"); }
    @font-face { font-family: "Nunito"; font-weight: 400; font-style: italic; font-display: swap;
                 src: url("/static/polices/Nunito-Italic.woff2") format("woff2"); }
    @font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-style: normal; font-display: swap;
                 src: url("/static/polices/IBMPlexMono-Regular.woff2") format("woff2"); }
    body { font-family: "Nunito", system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem;
           color: #1a1a1a; background: #fff; line-height: 1.5; }
    nav ul { list-style: none; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; padding: 0; margin: 0 0 1rem; }
    nav a { color: #1f4f9f; }
    nav a[aria-current="page"] { font-weight: 700; color: #1a1a1a; }
    label { display: block; font-weight: 600; margin-top: 1rem; }
    input, textarea, select { width: 100%; font: inherit; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1rem; font: inherit; padding: .5rem 1.25rem; cursor: pointer; }
    :focus-visible { outline: 3px solid #1f5fbf; outline-offset: 2px; }
    .reponse { border-left: 4px solid #1f6f3f; padding: .5rem 1rem; background: #f2f8f4; }
    .refus { border-left: 4px solid #8a5a00; padding: .5rem 1rem; background: #fdf6e9; }
    .erreur { border-left: 4px solid #a31515; padding: .5rem 1rem; background: #fbf0f0; }
    .aide { color: #4a4a4a; margin: .25rem 0 0; }
    dl { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: .25rem 1rem; }
    dt { font-weight: 600; }
    dd { margin: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; overflow-wrap: anywhere; }
    /* RGAA 10.11 : à 320 px, terme et valeur l'un sous l'autre, sans défilement horizontal. */
    @media (max-width: 30rem) { dl { grid-template-columns: minmax(0, 1fr); } dd { margin-bottom: .4rem; } }
    /* RGAA 12.7 : lien d'évitement, visible quand il reçoit le focus. */
    .evitement { position: absolute; left: -9999px; }
    .evitement:focus { position: static; display: inline-block; margin-bottom: .5rem; }
    .obligatoire { font-weight: 400; color: #4a4a4a; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; font-size: .95rem; }
    th, td { border: 1px solid #c8c8c8; padding: .35rem .5rem; text-align: left; vertical-align: top; }
    th { background: #f0f0f0; }
    code { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    fieldset { border: 1px solid #c8c8c8; padding: .5rem 1rem 1rem; margin: 1.5rem 0 0; }
    legend { font-weight: 700; padding: 0 .25rem; }
  </style>
  {# RGAA 8.2 : les styles propres à un écran restent dans l'en-tête de la page. #}
  {% block style %}{% endblock %}
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu</a>
<header>
  <nav aria-label="Pages de la console">
    <ul>
      <li><a href="/" {% if page == "accueil" %}aria-current="page"{% endif %}>Accueil</a></li>
      <li><a href="/referentiels" {% if page == "referentiels" %}aria-current="page"{% endif %}>Référentiels</a></li>
      <li><a href="/agent" {% if page == "agent" %}aria-current="page"{% endif %}>Agent</a></li>
      <li><a href="/demonstration" {% if page == "demonstration" %}aria-current="page"{% endif %}>Démonstration</a></li>
      <li><a href="/qualite" {% if page == "qualite" %}aria-current="page"{% endif %}>Qualité</a></li>
    </ul>
  </nav>
</header>
<main id="contenu" tabindex="-1">
{% block contenu %}{% endblock %}
</main>
</body>
</html>
