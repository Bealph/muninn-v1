[project]
name = "muninn"
version = "0.1.0"
description = "Secrétariat automatique de l'artisan qui travaille seul : V1 de soutenance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "azure-identity>=1.17",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "duckdb>=1.1",
    "langfuse==4.15.6",
]

[project.scripts]
muninn-db = "muninn.db.migrer:main"
muninn-ingestion = "muninn.ingestion.commande:main"
muninn-donnees = "muninn.donnees:main"
muninn-questions = "muninn.referentiels.demonstration:main"
muninn-purge = "muninn.traitements.enregistrement:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "playwright>=1.45",
    "axe-playwright-python>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muninn"]

[tool.uv]
# Reproductibilité et prudence : aucune version publiée depuis moins de deux semaines.
exclude-newer = "2026-09-29T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".outils"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/muninn", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Paquet de test sans annotations de type (enveloppe d'axe-core) : ses résultats sont convertis.
module = ["axe_playwright_python.*"]
ignore_missing_imports = true
