# Environnement local reproductible : API, console et PostgreSQL.
# Les valeurs viennent du fichier .env, jamais versionné (modèle : .env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - donnees-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: muninn:local
    env_file: .env
    environment:
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    image: muninn:local
    command: ["uvicorn", "muninn.console.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      ENVIRONMENT: local
      API_BASE_URL: http://api:8000
    ports:
      - "8001:8000"
    depends_on:
      - api

volumes:
  donnees-postgres:
